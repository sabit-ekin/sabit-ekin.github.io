<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t"><title id="t">Student research programs: two undergraduate researchers at a lab bench with an oscilloscope, a software-defined radio with an antenna, and a laptop plotting results</title><style>
