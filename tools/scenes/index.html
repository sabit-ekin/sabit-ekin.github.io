<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const ICON = (new URLSearchParams(location.search).get('s') || '').startsWith('icon-');
const W = ICON ? 1024 : 1600, H = ICON ? 1024 : 1200;
const C = { bg:0xf3ece4, cream:0xeadfd1, wall:0xe8dccd, maroon:0x7c1f2c, maroonD:0x5a1420, gold:0xe5a93b,
  teal:0x3f8b9a, tealL:0x8cc3cc, sage:0xa3b98f, sageD:0x7f9a6c, soil:0x9b7552, grey:0x8f8a84, greyL:0xbfb6ab,
  dark:0x3b3633, skin:0xe6bf9e, white:0xfbf7f2, road:0x6e6863 };

const P = new URLSearchParams(location.search);
const NAME = P.get('s') || 'research-comms';

const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true, alpha:ICON });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = ICON ? null : new THREE.Color(C.bg);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xfff6ea, 0xcdbcaa, 0.35));
const sun = new THREE.DirectionalLight(0xfff1df, 2.1);
sun.position.set(-6, 12, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 4; sun.shadow.bias = -0.0004;
Object.assign(sun.shadow.camera, { left:-9, right:9, top:9, bottom:-9, near:1, far:40 });
scene.add(sun);

// ---------- building blocks ----------
const mat = (c, o={}) => new THREE.MeshStandardMaterial({ color:c, roughness:o.r ?? 0.82, metalness:o.m ?? 0,
  emissive:o.e ?? 0x000000, emissiveIntensity:o.ei ?? 1, transparent:o.t ?? false, opacity:o.o ?? 1, envMapIntensity:o.env ?? 0.45 });
const glow = (c, o=0.35) => new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:o, depthWrite:false, side:THREE.DoubleSide });
function add(mesh, x=0, y=0, z=0, parent=scene) { mesh.position.set(x, y, z); mesh.castShadow = mesh.receiveShadow = true; parent.add(mesh); return mesh; }
const rbox = (w,h,d,c,r=0.08,o) => new THREE.Mesh(new RoundedBoxGeometry(w,h,d,4,Math.min(r,w/2,h/2,d/2)), mat(c,o));
const cyl = (rt,rb,h,c,seg=32,o) => new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(c,o));
const sph = (r,c,o) => new THREE.Mesh(new THREE.SphereGeometry(r,32,24), mat(c,o));
const cap = (r,l,c) => new THREE.Mesh(new THREE.CapsuleGeometry(r,l,8,16), mat(c));
function group(x=0,y=0,z=0,parent=scene){ const g=new THREE.Group(); g.position.set(x,y,z); parent.add(g); return g; }
function noShadow(m){ m.traverse(o=>{ o.castShadow=false; o.receiveShadow=false; }); return m; }

// tapered translucent beam from a to b
function beam(a, b, r0, r1, color=C.gold, op=0.32) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), len = A.distanceTo(B);
  const g = new THREE.CylinderGeometry(r1, r0, len, 40, 1, true); g.translate(0, len/2, 0);
  const m = new THREE.Mesh(g, glow(color, op)); m.position.copy(A);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), B.clone().sub(A).normalize());
  scene.add(noShadow(m));
  // brighter core
  const g2 = new THREE.CylinderGeometry(Math.max(r1*0.18,0.015), Math.max(r0*0.25,0.015), len, 16, 1, true); g2.translate(0,len/2,0);
  const core = new THREE.Mesh(g2, glow(color, Math.min(op*1.9, 0.85))); core.position.copy(A); core.quaternion.copy(m.quaternion);
  scene.add(noShadow(core));
  return m;
}
function laser(a, b, color=C.gold, r=0.03) { return beam(a, b, r, r, color, 0.9); }
// concentric wave rings, centered at p, facing direction n
function rings(p, n, count, r0, dr, color=C.gold, op=0.55, tube=0.03) {
  for (let i=0;i<count;i++) {
    const m = new THREE.Mesh(new THREE.TorusGeometry(r0+i*dr, tube, 12, 96), glow(color, op*(1-i/(count+0.5))));
    m.position.set(...p); m.lookAt(new THREE.Vector3(...p).add(new THREE.Vector3(...n))); scene.add(noShadow(m));
  }
}
// partial arcs (wavefronts) heading along direction from p
function arcs(p, dir, count, r0, dr, color=C.gold, op=0.6, spread=Math.PI/2.4, tube=0.035) {
  const d = new THREE.Vector3(...dir).normalize();
  for (let i=0;i<count;i++) {
    const m = new THREE.Mesh(new THREE.TorusGeometry(r0+i*dr, tube, 10, 64, spread), glow(color, op*(1-i/(count+0.6))));
    const g = new THREE.Group(); g.position.set(...p); g.add(m); m.rotation.z = -spread/2;
    g.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), d); scene.add(noShadow(g));
  }
}
// diorama base slab
function base(w, d, top=C.cream, side=C.greyL, h=0.5) {
  add(rbox(w, h, d, side, 0.18), 0, -h/2-0.02, 0);
  add(rbox(w-0.06, 0.06, d-0.06, top, 0.03), 0, 0.0, 0);
}
function person(x, z, shirt=C.teal, o={}) {
  const g = group(x, 0, z); g.rotation.y = o.ry ?? 0; const s = o.s ?? 1;
  if (o.sit) {
    add(cap(0.16*s, 0.42*s, shirt), 0, 0.95*s, 0, g);
    const thigh = add(cap(0.09*s, 0.42*s, C.dark), 0.1*s, 0.62*s, 0.26*s, g); thigh.rotation.x = Math.PI/2;
    const thigh2 = add(cap(0.09*s, 0.42*s, C.dark), -0.1*s, 0.62*s, 0.26*s, g); thigh2.rotation.x = Math.PI/2;
    add(cap(0.08*s, 0.4*s, C.dark), 0.1*s, 0.32*s, 0.5*s, g); add(cap(0.08*s, 0.4*s, C.dark), -0.1*s, 0.32*s, 0.5*s, g);
    add(sph(0.17*s, C.skin), 0, 1.42*s, 0, g);
  } else {
    add(cap(0.17*s, 0.5*s, shirt), 0, 1.15*s, 0, g);
    add(cap(0.085*s, 0.55*s, C.dark), 0.09*s, 0.42*s, 0, g); add(cap(0.085*s, 0.55*s, C.dark), -0.09*s, 0.42*s, 0, g);
    add(sph(0.18*s, C.skin), 0, 1.66*s, 0, g);
    const armL = add(cap(0.06*s, 0.42*s, shirt), 0.24*s, 1.1*s, 0, g); armL.rotation.z = 0.12;
    const armR = add(cap(0.06*s, 0.42*s, shirt), -0.24*s, (o.wave ? 1.5 : 1.1)*s, 0, g); armR.rotation.z = o.wave ? 2.7 : -0.12;
  }
  const hair = add(sph(0.175*s, o.hair ?? 0x4a3328), 0, (o.sit?1.47:1.71)*s, -0.02*s, g); hair.scale.set(1,0.62,1);
  return g;
}
function dish(pos, target, r=1.0, depth=0.38, c=C.maroon) {
  const pts=[]; for (let i=0;i<=24;i++){ const x=r*i/24; pts.push(new THREE.Vector2(x, depth*(x/r)**2)); }
  const m = new THREE.Mesh(new THREE.LatheGeometry(pts, 64), mat(c, {r:0.55})); m.material.side = THREE.DoubleSide;
  m.position.set(...pos); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3(...target).sub(new THREE.Vector3(...pos)).normalize());
  m.castShadow = m.receiveShadow = true; scene.add(m);
  // feed horn on struts
  const d = new THREE.Vector3(...target).sub(new THREE.Vector3(...pos)).normalize(), f = new THREE.Vector3(...pos).addScaledVector(d, r*0.75);
  add(sph(0.08, C.gold, {e:C.gold, ei:0.8}), f.x, f.y, f.z);
  const len = r*0.78, g = new THREE.CylinderGeometry(0.018,0.018,len,8); g.translate(0,len/2,0);
  for (let k=0;k<3;k++){ const a=k*2.094; const off=new THREE.Vector3(Math.cos(a),0,Math.sin(a)).applyQuaternion(m.quaternion).multiplyScalar(r*0.85);
    const st=new THREE.Mesh(g, mat(C.greyL)); const st0=new THREE.Vector3(...pos).add(off).addScaledVector(d, depth*0.72); st.position.copy(st0);
    st.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), f.clone().sub(st0).normalize()); st.scale.y = f.distanceTo(st0)/len; scene.add(st); }
  return f;
}
function tree(x, z, s=1) { add(cyl(0.07*s,0.09*s,0.6*s,0x8a6a4e), x, 0.3*s, z); add(sph(0.42*s, C.sageD), x, 0.9*s, z); }
function camera(pos, look, fov=30) {
  const cam = new THREE.PerspectiveCamera(fov, W/H, 0.1, 200); cam.position.set(...pos); cam.lookAt(new THREE.Vector3(...look)); return cam;
}

  const feed = dish([-3.4, 1.45, 1.4], [2.9, 5.6, -2.4], 1.1, 0.42);

  add(cyl(0.02,0.02,0.6,C.greyL), 0, -0.6, 0, sat);

  beam([feed.x, feed.y, feed.z], [2.75, 5.35, -2.3], 0.22, 0.8, C.gold, 0.24);

  for (let a=0;a<3;a++){ const p = add(rbox(0.14, 0.55, 0.22, C.maroon, 0.04), Math.cos(a*2.1)*0.18, 3.0, Math.sin(a*2.1)*0.18, tw); p.rotation.y = -a*2.1; }
  const bld = [[3.6,1.8,0.9,1.6,C.teal],[4.4,0.8,0.8,2.3,C.sage],[3.2,-0.6,1.0,1.2,C.tealL],[4.5,-1.6,0.8,1.8,C.sage]];
  for (const [x,z,w,h,c] of bld) { add(rbox(w,h,w,c,0.08), x, h/2, z); for (let y=0.35;y<h-0.2;y+=0.38) add(rbox(w*0.62,0.12,0.02,C.white,0.02), x, y, z+w/2+0.005); }
  beam([1.45, 3.0, 2.25], [3.15, 1.3, 2.25], 0.05, 0.28, C.gold, 0.3);

  add(rbox(0.9, 0.65, 0.8, C.greyL, 0.08), -2.0, 0.33, 2.3);
  return camera([13.5, 10.8, 15.5], [0.4, 2.2, 0], 31);
};

// ---------- icons: one object, transparent background ----------
function shadowCatcher(y=0, r=2.3, op=0.12) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 64), new THREE.ShadowMaterial({ opacity:op }));
  m.rotation.x = -Math.PI/2; m.position.y = y; m.receiveShadow = true; scene.add(m);
}
function iconCam(look=[0,1,0], dist=9, h=0.55, fov=26) { const d=new THREE.Vector3(1, h, 1.15).normalize().multiplyScalar(dist);
  return camera([look[0]+d.x, look[1]+d.y, look[2]+d.z], look, fov); }
