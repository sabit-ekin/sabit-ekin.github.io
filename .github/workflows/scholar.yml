name: Update Google Scholar citations

on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC (8 a.m. Central)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 .github/scripts/update_scholar.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "Nothing to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Citations: weekly update from Google Scholar"
          git push
